server:
  port: 8081

spring:
  datasource:
    url: ${MY_DB_URL}
    username: ${MY_DB_USER}
    password: ${MY_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

