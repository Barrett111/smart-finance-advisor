server.port=${PORT:10000}
spring.application.name=core-wallet-service

spring.datasource.url=${SECURE_MAPPING_URL}
spring.datasource.username=${SECURE_MAPPING_USER}
spring.datasource.password=${SECURE_MAPPING_PWD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

gemini.api-key=${GEMINI_API_KEY}
services.ml-analytics.url=${SERVICES_ML_ANALYTICS_URL:http://localhost:8000}

